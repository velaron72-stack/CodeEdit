name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME). The old setup-android action tried to install the
      # removed "tools" package and failed, so sdkmanager from the image is used directly.
      - name: Install SDK components (platform, build-tools, NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "sdkmanager: $SDKM  ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Grammars/themes/fonts normally ship inside the repo (app/src/main/assets). This step only fills gaps
      # (e.g. a repo created without the 14 MB asset folder) from the same upstream packages.
      - name: Ensure TextMate grammar/theme + font assets
        run: bash tools/ensure_assets.sh

      - name: Native unit tests (host, TextMate engine vs vscode-textmate corpus)
        run: bash tools/run_native_tests.sh 2>&1 | tee native-tests.log
        continue-on-error: false

      - name: Lint + JVM unit tests
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest 2>&1 | tee lint-test.log

      - name: Decode release keystore (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "release signing: ENABLED"
          else
            echo "release signing: no secrets -> release APK will be UNSIGNED (app-*-release-unsigned.apk)"
          fi

      - name: Build debug + release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease 2>&1 | tee assemble.log

      - name: Collect build log summary
        if: always()
        run: |
          mkdir -p ci-out
          { echo "sha=${GITHUB_SHA}"; echo "run=${GITHUB_RUN_NUMBER}"; echo "job_status=${{ job.status }}"; echo "-----"; \
            for f in native-tests.log lint-test.log assemble.log; do [ -f $f ] && { echo "=== $f (errors) ==="; grep -n -E "error:|^e: |FAILED|FAILURE|What went wrong|Execution failed|AssertionError|undefined reference|fatal error|CMake Error|\* Where|Caused by" $f | head -150; echo "=== $f (tail) ==="; tail -60 $f; }; done; } > ci-out/summary.txt
          cp native-tests.log lint-test.log assemble.log ci-out/ 2>/dev/null || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-out/
